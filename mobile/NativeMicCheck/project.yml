name: NativeMicCheck
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    DEVELOPMENT_TEAM: F72GFU3YCH
targets:
  NativeMicCheck:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhuangxu.nativemiccheck
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Native Mic Check
        NSMicrophoneUsageDescription: Verify native microphone input locally. No audio is saved or uploaded.
        UILaunchScreen: {}
schemes:
  NativeMicCheck:
    build:
      targets:
        NativeMicCheck: all
