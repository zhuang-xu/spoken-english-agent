name: SpokenAgents
options:
  bundleIdPrefix: com.spokenagents
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  SpokenAgents:
    type: application
    platform: iOS
    sources: [SpokenAgents]
    info:
      path: SpokenAgents/Info.plist
      properties:
        APIBaseURL: $(API_BASE_URL)
        EntraClientID: $(ENTRA_CLIENT_ID)
        EntraTenantID: $(ENTRA_TENANT_ID)
        EntraAPIScope: $(ENTRA_API_SCOPE)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - msauth.$(PRODUCT_BUNDLE_IDENTIFIER)
        LSApplicationQueriesSchemes:
          - msauthv2
          - msauthv3
        NSMicrophoneUsageDescription: Record your speaking turns during a live practice and upload them for pronunciation and fluency feedback.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhuangxu.spokenagents.app
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SpokenAgents/SpokenAgents.entitlements
        DEVELOPMENT_TEAM: F72GFU3YCH
        API_BASE_URL: https://spoken-agent-func-4fa2534c.azurewebsites.net
        ENTRA_CLIENT_ID: de83c9a6-ce5f-4acc-9d6a-aa91f6e93547
        ENTRA_TENANT_ID: 92d6ad81-2630-4f30-9758-b3891cfc2528
        ENTRA_API_SCOPE: api://75694815-28ae-46c6-b566-d7c895d31899/access_as_user
  SpokenAgentsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SpokenAgentsTests]
    dependencies:
      - target: SpokenAgents
    settings:
      base:
        DEVELOPMENT_TEAM: F72GFU3YCH
        GENERATE_INFOPLIST_FILE: YES
  SpokenAgentsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SpokenAgentsUITests]
    dependencies:
      - target: SpokenAgents
    settings:
      base:
        DEVELOPMENT_TEAM: F72GFU3YCH
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SpokenAgents:
    build:
      targets:
        SpokenAgents: all
    test:
      targets:
        - SpokenAgentsTests
        - SpokenAgentsUITests
